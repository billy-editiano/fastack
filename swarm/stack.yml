version: "3.8"

services:
  mariadb:
    image: '[[ published_image("mariadb", "fastack/mariadb") ]]'
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppassword
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - fastack

  app:
    image: '[[ published_image("app", "fastack/app") ]]'
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    networks:
      - fastack

  worker:
    image: '[[ published_image("worker", "fastack/worker") ]]'
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    ports:
      - target: 8000
        published: 8001
        protocol: tcp
        mode: ingress
    networks:
      - fastack

networks:
  fastack:
    driver: overlay

volumes:
  mariadb-data: {}
