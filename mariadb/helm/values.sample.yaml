image:
  registry: ""
  repository: fastack/mariadb
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3306

auth:
  rootPassword:
    existingSecret: null
    existingSecretKey: null
    value: rootpassword
  database: appdb
  user: appuser
  password:
    existingSecret: null
    existingSecretKey: null
    value: apppassword

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
