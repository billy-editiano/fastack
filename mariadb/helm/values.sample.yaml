image:
  registry: "[[ target.registry ]]"
  repository: "[[ join(project.name, 'fastack/mariadb') ]]"
  tag: "[[ artifact.version ]]"
  pullPolicy: IfNotPresent

auth:
  rootPassword:
    existingSecretName: null
    existingSecretKey: null
    value: rootpassword
  database: appdb
  user: appuser
  password:
    existingSecretName: null
    existingSecretKey: null
    value: apppassword

service:
  type: ClusterIP
  port: 3306

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
