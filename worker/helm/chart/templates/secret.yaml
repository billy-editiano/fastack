{{- if and (not .Values.database.password.existingSecretName) (not .Values.database.password.value) }}
{{- fail "database.password.value or database.password.existingSecretName must be set" }}
{{- end }}
{{- if and (not .Values.database.password.existingSecretName) .Values.database.password.value }}
# Only create a secret when no external secret is provided.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-db
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password.value | quote }}
{{- end }}
