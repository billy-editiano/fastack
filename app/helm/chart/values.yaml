replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  registry: "[[ target.registry ]]"
  repository: "[[ join(project.name, 'fastack/app') ]]"
  pullPolicy: IfNotPresent
  tag: "[[ artifact.version ]]"

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8000

env: []

probes:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
