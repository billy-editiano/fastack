image:
  registry: ""
  repository: "[[ join(target.registry, project.name, 'fastack/mariadb') ]]"
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3306

  auth:
  rootPassword:
    existingSecretName: null
    existingSecretKey: null
    value: rootpassword
  database: appdb
  user: appuser
  password:
    existingSecretName: null
    existingSecretKey: null
    value: apppassword

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
