{{- $rootSecret := .Values.auth.rootPassword.existingSecret }}
{{- $rootValue := .Values.auth.rootPassword.value }}
{{- $passwordSecret := .Values.auth.password.existingSecret }}
{{- $passwordValue := .Values.auth.password.value }}
{{- if and (not $rootSecret) (not $rootValue) (not $passwordSecret) (not $passwordValue) }}
{{- fail "at least one of auth.rootPassword.value, auth.rootPassword.existingSecret, auth.password.value, or auth.password.existingSecret must be set" }}
{{- end }}
{{- if or $rootValue $passwordValue }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-auth
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $rootValue }}
  root-password: {{ $rootValue | quote }}
  {{- end }}
  {{- if $passwordValue }}
  password: {{ $passwordValue | quote }}
  {{- end }}
{{- end }}
