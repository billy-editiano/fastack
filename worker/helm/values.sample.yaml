image:
  registry: "[[ target.registry ]]"
  repository: "[[ join(project.name, 'fastack/worker') ]]"
  tag: "[[ artifact.version ]]"
  pullPolicy: IfNotPresent

database:
  host: "{{ .Release.Name }}-mariadb-service"
  port: 3306
  name: appdb
  user: appuser
  password:
    existingSecretName: null
    existingSecretKey: null
    value: apppassword

service:
  type: ClusterIP
  port: 8000

env: []
