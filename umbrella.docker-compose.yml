name: fastack-test

services:
  mariadb:
    image: fastack/mariadb:latest
    build:
      context: ./mariadb
      dockerfile: Dockerfile
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppassword
    ports:
      - "33060:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    image: fastack/app:latest
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  worker:
    image: fastack/worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    ports:
      - "8001:8000"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
